repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v5.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
            # Estas dos son plantillas gomplate, no YAML: el parser se atraganta
            # con las directivas {{- ... }} de la primera linea.
            exclude: ^config(\.dashboard)?\.docker\.yaml$
          - id: check-added-large-files

    - repo: https://github.com/golangci/golangci-lint
      rev: v2.13.1
      hooks:
          - id: golangci-lint
            args: [--timeout, 5m]

    - repo: https://github.com/dnephin/pre-commit-golang
      rev: v0.5.1
      hooks:
          - id: go-fmt
          - id: go-mod-tidy

    - repo: https://github.com/ansible/ansible-lint
      rev: v25.9.2
      hooks:
          - id: ansible-lint
            files: ^ansible/
            # Sin esto, pre-commit le pasa la lista de ficheros cambiados uno
            # a uno; ansible-lint entonces autodescubre "proyecto" desde la
            # raiz del repo y se pone a lintear YAML de todas partes (.github,
            # examples, scripts/manifests...). Con la ruta fija se comporta
            # igual que la comprobacion manual del Step 5.
            pass_filenames: false
            args: [ansible/]
