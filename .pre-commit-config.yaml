repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v5.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
            # Estas dos son plantillas gomplate, no YAML: el parser se atraganta
            # con las directivas {{- ... }} de la primera linea.
            exclude: ^config(\.dashboard)?\.docker\.yaml$
          - id: check-added-large-files

    - repo: https://github.com/golangci/golangci-lint
      rev: v2.13.1
      hooks:
          - id: golangci-lint
            args: [--timeout, 5m]

    - repo: https://github.com/dnephin/pre-commit-golang
      rev: v0.5.1
      hooks:
          - id: go-fmt
          - id: go-mod-tidy

    - repo: https://github.com/ansible/ansible-lint
      # v25.9.2 entra en recursion sin control al descubrir ficheros con el
      # enlace ansible/.collections puesto (coleccion rasty94.dex); v26.8.0 no.
      rev: v26.8.0
      hooks:
          - id: ansible-lint
            files: ^ansible/
            # Sin esto, pre-commit le pasa la lista de ficheros cambiados uno
            # a uno; ansible-lint entonces autodescubre "proyecto" desde la
            # raiz del repo y se pone a lintear YAML de todas partes (.github,
            # examples, scripts/manifests...). Con la ruta fija se comporta
            # igual que la comprobacion manual del Step 5.
            pass_filenames: false
            args: [ansible/]
            # El hook corre en su propio virtualenv, que solo trae
            # ansible-core: sin esto no resuelve community.crypto ni
            # community.docker y falla SIEMPRE con "couldn't resolve
            # module/action", pase lo que pase en el arbol. Un hook que falla
            # siempre ensena a saltarselo, y entonces no comprueba nada.
            # El paquete "ansible" es el bundle de la comunidad e incluye las
            # dos colecciones de ansible/requirements.yml; queda dentro del
            # entorno del hook, que ya esta en su ANSIBLE_COLLECTIONS_PATH.
            # Es la solucion que documenta el propio ansible-lint para este
            # sintoma. La alternativa --que ansible-lint las instale desde
            # requirements.yml-- solo funciona con el fichero en la raiz del
            # repositorio, porque lo busca en el directorio de trabajo y no en
            # el proyecto que el mismo detecta.
            additional_dependencies: [ansible]

    - repo: local
      hooks:
          # Ninguna herramienta estandar impone el FQCN en los playbooks de
          # una coleccion: "roles: [mariadb]" a secas pasa --syntax-check y
          # ansible-lint en perfil production (comprobado en la tarea 2),
          # porque ansible/roles/mariadb resuelve por directorio. "Solo
          # rasty94.dex.<rol>" es una convencion de este repositorio, y este
          # hook es lo unico que la impone.
          #
          # Es awk y no "grep -v", porque un grep -v que filtra por linea
          # entera deja pasar una lista mixta como
          # "roles: [rasty94.dex.mariadb, keepalived]": la linea contiene un
          # FQCN valido, asi que grep -v la descarta entera y el nombre corto
          # no se ve. Aqui se separa la lista por comas y se exige el FQCN
          # elemento a elemento. Tambien evita "grep -P": en esta maquina el
          # grep del PATH de un script no interactivo es BSD grep, sin -P.
          - id: fqcn-en-playbooks
            name: Los roles de los playbooks van por FQCN
            language: system
            files: ^ansible/playbooks/.*\.ya?ml$
            entry: 'awk ''BEGIN{bad=0} /roles:[ \t]*\[/{line=$0; s=index(line,"["); e=index(line,"]"); inside=substr(line,s+1,e-s-1); n=split(inside,arr,","); for(i=1;i<=n;i++){gsub(/^[ \t]+|[ \t]+$/,"",arr[i]); if (arr[i] !~ /^rasty94\.dex\.[a-z_]+$/){print FILENAME":" FNR ": rol sin FQCN (rasty94.dex.<rol>): " arr[i]; bad=1}}} END{exit bad}'''
