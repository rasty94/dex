# Inventario de ejemplo. Las tres topologias de Valkey estan comentadas abajo.
# Direcciones del rango de documentacion (RFC 5737, 192.0.2.0/24): nadie las
# confunde con una maquina real. ansible_host va en TODOS los hosts porque el
# rol valkey (Task 10) lee hostvars[h].ansible_host para montar el cluster, y
# el rol dex lo hace ya en esta tarea para las direcciones de Valkey.
all:
  children:
    valkey:
      hosts:
        valkey-1:
          ansible_host: 192.0.2.11
        valkey-2:
          ansible_host: 192.0.2.12
      vars:
        # standalone: una sola maquina en este grupo.
        # sentinel: varias, mas el grupo valkey_sentinel con 3 votantes impares.
        # cluster: tres maquinas, seis procesos.
        valkey_topology: sentinel
        valkey_master_set: dex
    valkey_sentinel:
      # Tres votantes. Con solo dos maquinas de datos, el tercero va en un nodo
      # de dex: con dos, perder una deja un sentinel solo y no hay promocion.
      hosts:
        valkey-1: {}
        valkey-2: {}
        dex-1: {}
    dex:
      hosts:
        dex-1:
          ansible_host: 192.0.2.21
        dex-2:
          ansible_host: 192.0.2.22
      vars:
        dex_issuer: https://sso.interno/dex   # la URL del balanceador, no la del nodo
        # El passthrough del gRPC hace que el panel marque el nombre del
        # balanceador; sin estas dos SAN, Go rechaza el certificado del nodo
        # por nombre y el panel no conecta. Cambiarlas reemite el certificado
        # de todos los nodos de dex y los reinicia, de uno en uno.
        internal_ca_extra_sans:
          - "DNS:sso.interno"
          - "IP:192.0.2.30"
        # Atar los puertos a la interfaz privada. Ver el comentario de
        # dex_http_bind en los defaults del rol: con el TLS terminado en el
        # balanceador esto es un requisito, no un ajuste.
        dex_http_bind: "{{ ansible_host }}"
        dex_grpc_bind: "{{ ansible_host }}"
        dex_storage:
          type: mysql
          # El BALANCEADOR, no una maquina. HAProxy manda al unico nodo que la
          # sonda declara primario escribible, asi que tras un failover dex
          # sigue apuntando al mismo sitio. Apuntarlo a db-1 seria dejar el
          # punto unico de fallo que esta fase existe para quitar.
          host: db.interno
          port: 3306
          database: dex
          user: dex
          # "true" y no "false": desde la fase 4 la base de datos es NUESTRA y
          # la sirve el rol mariadb con el certificado de la CA interna, la
          # misma que este nodo ya lleva. El aviso del rol dex se queda para
          # quien lo apunte a una base ajena.
          ssl_mode: "true"
          ssl_ca_file: /etc/dex/internal-ca.pem
    dex_dashboard:
      hosts:
        dex-1: {}
        dex-2: {}
      vars:
        # Nombre propio, no una ruta bajo el del issuer: el panel registra
        # todas sus rutas en la raiz y no sabe servirse bajo un prefijo. Bajo
        # https://sso.interno/dex-dashboard el login entra en bucle infinito
        # de redirecciones (comprobado). El certificado del sitio tiene que
        # cubrir este nombre y el del issuer.
        dex_dashboard_base_url: https://panel.interno/
        # Este inventario describe un despliegue con balanceador delante (el
        # base_url de arriba es el suyo, no el de un nodo), asi que la cabecera
        # X-Forwarded-For la pone el balanceador y el limitador de login puede
        # fiarse de ella. Sin esto, todos los administradores comparten un solo
        # cubo, el de la direccion del balanceador. Al reves --encenderlo sin
        # balanceador delante-- es peor: quien llega directo elige su clave.
        dex_dashboard_trust_forwarded_for: true
        dex_dashboard_admin_emails:
          - admin@example.com
        dex_dashboard_bind: "{{ ansible_host }}"
        # Por el balanceador, no por el dex de esta misma maquina: si ese dex
        # cae, este panel queda inutil y su /healthz sigue devolviendo 200, asi
        # que el balanceador le seguiria mandando administradores a paginas que
        # van a fallar todas. El default del rol (127.0.0.1) sigue siendo la
        # respuesta correcta para quien no tenga balanceador.
        dex_dashboard_grpc_address: "sso.interno:5557"

    loadbalancer:
      hosts:
        lb-1:
          ansible_host: 192.0.2.31
          keepalived_priority: 110      # el MASTER de partida
        lb-2:
          ansible_host: 192.0.2.32
          keepalived_priority: 100
      vars:
        keepalived_vip: 192.0.2.30
        keepalived_interface: eth0
        # Explicito a proposito: dos despliegues en la misma L2 con el mismo id
        # se pelean por la misma VIP, y eso se manifiesta como una VIP que
        # parpadea entre maquinas de despliegues que no se conocen.
        keepalived_router_id: 51

    mariadb:
      hosts:
        db-1:
          ansible_host: 192.0.2.41
          # Identidad de replicacion, explicita y estable. NO se deriva del
          # indice del grupo a proposito: reordenar el inventario reasignaria
          # identidades, y dos nodos con el mismo server_id rompen la
          # replicacion sin decirlo.
          mariadb_server_id: 1
        db-2:
          ansible_host: 192.0.2.42
          mariadb_server_id: 2
      vars:
        # Quien arranca de primario, SOLO la primera vez. A partir de ahi manda
        # orchestrator y el rol lee el papel en vez de asignarlo.
        #
        # El certificado de cada nodo necesita el nombre del balanceador entre
        # sus SAN: dex se conecta marcando ese nombre --db.interno resuelve a la
        # VIP-- y la sesion TLS se negocia contra el nodo que toque. Sin esto,
        # Go rechaza el certificado por nombre y dex no arranca.
        internal_ca_extra_sans:
          - "DNS:db.interno"
          - "IP:192.0.2.30"
        # Atar el puerto a la interfaz privada, igual que dex_http_bind: el
        # contenedor va en red de host, asi que quien limita la exposicion es
        # esta directiva.
        #
        # Y el loopback ADEMAS de la interfaz privada, no en su lugar: el rol
        # habla consigo mismo por 127.0.0.1 --root.cnf lleva host = 127.0.0.1,
        # el "mariadb-admin ping" de la espera de arranque y probe.cnf del
        # agente de sonda tambien-- asi que atarlo solo a ansible_host deja al
        # propio rol sin poder conectarse a su nodo. MariaDB 11.4 acepta una
        # lista separada por comas (comprobado: "mariadbd --help" dice "Several
        # addresses may be specified, separated by a comma").
        mariadb_bind_address: "127.0.0.1,{{ ansible_host }}"
        # Declarados aqui y no dejados al default del rol, y no es redundancia:
        # el balanceador los lee por hostvars desde OTRA tanda, y los defaults
        # de un rol solo existen en la tanda que lo incluye. Sin estas dos
        # lineas, haproxy.cfg.j2 falla con "undefined variable" al renderizar.
        mariadb_port: 3306
        mariadb_probe_port: 3307

    orchestrator:
      # Tres votantes, y el tercero NO es una maquina de base de datos: con dos
      # nodos de datos, un orchestrator en cada uno deja al superviviente sin
      # quorum justo el dia que hace falta promover. Es el mismo patron que el
      # tercer sentinel de la fase 2, que vive en un nodo de dex.
      hosts:
        db-1: {}
        db-2: {}
        lb-1: {}
