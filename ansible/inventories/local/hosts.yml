# Las rutas del repositorio van por inventory_dir y NO por playbook_dir: el
# playbook vive dentro de la coleccion, y con la coleccion instalada
# playbook_dir cae en ~/.ansible/collections. inventory_dir es este fichero,
# que si sabe donde esta el repositorio. Tres niveles arriba es la raiz.
#
# Inventario de converge: un solo host fisico, este mismo, gestionado con
# ansible_connection: local bajo dos nombres de inventario ("localhost" para
# dex y el panel, "valkey-converge" para el rol valkey de la Task 10). Los
# *_config_dir caen dentro del worktree, nunca en /etc: el objetivo es un
# directorio desechable, no el arbol del sistema.
#
# valkey-converge no usa 127.0.0.1 como ansible_host: el primero es el
# loopback del propio contenedor de dex (que no corre en red de host), y
# host.docker.internal no resuelve desde el host (macOS) donde corre
# wait_for. La IP LAN de esta maquina la alcanzan los dos: el host de
# Ansible y, via Docker Desktop, el contenedor de dex. CAMBIAR por la IP real
# de quien reproduzca esto. ansible_connection: local hace que Ansible
# ejecute aqui mismo pese a ese ansible_host: "local" nunca abre SSH, lo usa
# solo como dato para las plantillas (SAN del certificado del nodo,
# direcciones que arma dex/config.yaml.j2).
#
# ansible_become: false en los dos hosts: las tandas del playbook escalan
# porque en una maquina de verdad escriben en /etc, pero aqui todo cae dentro
# del arbol de trabajo y con el usuario que lanza el converge. Es una variable
# de conexion, asi que gana a la directiva "become: true" de las tandas.
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_become: false
      ansible_host: 127.0.0.1
      # community.crypto necesita el paquete "cryptography"; esta en el venv
      # del worktree (Ruling 9), no en el Python del sistema.
      ansible_python_interpreter: "{{ inventory_dir }}/../../../.venv/bin/python3"
    valkey-converge:
      ansible_connection: local
      ansible_become: false
      ansible_host: 192.168.1.37
      ansible_python_interpreter: "{{ inventory_dir }}/../../../.venv/bin/python3"
    # Segundo nodo de MariaDB (Fase 4, tarea 3): mismo host fisico que
    # "localhost", bajo otro nombre de inventario, igual que valkey-converge lo
    # es de la maquina LAN. ansible_host 127.0.0.1 y no la IP LAN: los dos
    # contenedores corren en network_mode: host en esta misma maquina y se ven
    # entre si por loopback (ver la nota de entorno de la tarea).
    mariadb-2:
      ansible_connection: local
      ansible_become: false
      ansible_host: 127.0.0.1
      ansible_python_interpreter: "{{ inventory_dir }}/../../../.venv/bin/python3"
    # Las tres instancias de orchestrator (Fase 4, tarea 5): mismo host fisico,
    # mismo patron que mariadb-2 arriba. Tres y no una sola porque el raft
    # exige quorum impar (assert propio del rol); en este converge las tres
    # viven en la misma maquina, asi que cada una necesita su propio puerto
    # HTTP y de raft para no chocar entre si -- en produccion cada una iria en
    # una maquina distinta y compartirian orchestrator_raft_port sin problema.
    orch-1:
      ansible_connection: local
      ansible_become: false
      ansible_host: 127.0.0.1
      ansible_python_interpreter: "{{ inventory_dir }}/../../../.venv/bin/python3"
    orch-2:
      ansible_connection: local
      ansible_become: false
      ansible_host: 127.0.0.1
      ansible_python_interpreter: "{{ inventory_dir }}/../../../.venv/bin/python3"
    orch-3:
      ansible_connection: local
      ansible_become: false
      ansible_host: 127.0.0.1
      ansible_python_interpreter: "{{ inventory_dir }}/../../../.venv/bin/python3"
  children:
    valkey:
      hosts:
        valkey-converge: {}
      vars:
        valkey_topology: standalone
        # t10-: para no chocar con un "valkey" suelto que ya exista en esta
        # maquina (ver la nota de nombrado del propio rol).
        valkey_container_name: t10-valkey
        valkey_config_dir: "{{ inventory_dir }}/../../../.converge/valkey"
        valkey_port: 16379
        valkey_config_owner: "{{ ansible_facts.user_id }}"
        valkey_config_group: "{{ ansible_facts.user_gid }}"
    dex:
      hosts:
        localhost: {}
      vars:
        # IP LAN, no loopback: el panel corre en su propio contenedor y tiene
        # que poder resolver el issuer para el descubrimiento OIDC.
        dex_issuer: http://192.168.1.37:15556/dex
        # Nombre distinto del que usan los ejemplos de Ejemplos/dashboard, que
        # pueden estar corriendo en la misma maquina a la vez que este converge.
        dex_container_name: dex-converge
        dex_config_dir: "{{ inventory_dir }}/../../../.converge/dex"
        dex_http_port: 15556
        dex_grpc_port: 15557
        dex_telemetry_port: 15558
        dex_valkey_port: 16379
        dex_config_owner: "{{ ansible_facts.user_id }}"
        dex_config_group: "{{ ansible_facts.user_gid }}"
        dex_storage:
          type: mysql
          host: 192.168.1.37
          port: 13306
          database: dex
          user: dex
    dex_dashboard:
      hosts:
        localhost: {}
      vars:
        dex_dashboard_container_name: dex-dashboard-converge
        dex_dashboard_config_dir: "{{ inventory_dir }}/../../../.converge/dex-dashboard"
        dex_dashboard_listen_port: 15560
        dex_dashboard_base_url: "http://127.0.0.1:15560"
        dex_dashboard_grpc_address: "192.168.1.37:15557"
        dex_dashboard_admin_emails:
          - admin@example.com
        dex_dashboard_config_owner: "{{ ansible_facts.user_id }}"
        dex_dashboard_config_group: "{{ ansible_facts.user_gid }}"
    mariadb:
      # Identidad de replicacion, nombres de contenedor, directorio y puertos:
      # propios de CADA host y no del grupo, porque tienen que ser distintos
      # entre los dos nodos (server_id, y en el converge local tambien
      # puertos y directorio, que en produccion coincidirian). El resto
      # --propietario de fichero, contrasenas-- es igual para los dos y vive
      # en "vars:" del grupo (tarea 3).
      hosts:
        localhost:
          mariadb_server_id: 1
          mariadb_container_name: t14-mariadb
          mariadb_probe_container_name: t14-mariadb-probe
          mariadb_config_dir: "{{ inventory_dir }}/../../../.converge/mariadb"
          mariadb_port: 13306
          mariadb_probe_port: 13307
        mariadb-2:
          mariadb_server_id: 2
          mariadb_container_name: t14-mariadb-2
          mariadb_probe_container_name: t14-mariadb-probe-2
          mariadb_config_dir: "{{ inventory_dir }}/../../../.converge/mariadb-2"
          mariadb_port: 13316
          mariadb_probe_port: 13317
      vars:
        # UID numerico y no el nombre de usuario (a diferencia de dex/valkey en
        # este mismo fichero): la tarea 2 pone mariadb-probe a correr como
        # "{{ mariadb_config_owner }}:{{ mariadb_config_group }}" en el
        # docker-compose, y ese valor lo resuelve el DAEMON de Docker dentro
        # del passwd del CONTENEDOR, no el host. "antoniorodriguez" no existe
        # ahi ("unable to find user antoniorodriguez", comprobado); un UID
        # numerico no necesita existir en ningun passwd. chown en el host
        # acepta un UID numerico igual de bien que un nombre, asi que no
        # rompe nada de lo que ya escribia la tarea 1.
        mariadb_config_owner: "{{ ansible_facts.user_uid }}"
        mariadb_config_group: "{{ ansible_facts.user_gid }}"
        mariadb_allow_no_password: true
    loadbalancer:
      # Converge de la tarea 4 (rol haproxy, frontend/backend de mysql). Mismo
      # host fisico que "localhost", reusado bajo el grupo que el rol
      # haproxy espera: el propio "localhost" ya esta en los grupos dex y
      # dex_dashboard, que es lo que haproxy_dex_issuer y
      # haproxy_dashboard_base_url leen por hostvars.
      hosts:
        localhost: {}
      vars:
        haproxy_container_name: t14-haproxy
        haproxy_config_dir: "{{ inventory_dir }}/../../../.converge/haproxy"
        haproxy_mysql_port: 13300
        # El 443 de fabrica es privilegiado: el contenedor de la imagen
        # oficial no corre como root y el bind falla con "Permission denied"
        # en este converge. No hace falta ese frontend para probar el de
        # mysql (task 4), asi que un puerto sin privilegios basta para poder
        # arrancar el proceso entero -- haproxy no arranca NINGUN listener si
        # uno falla.
        haproxy_https_port: 18443
    orchestrator:
      # Fase 4, tarea 5. Cada instancia lleva su propio puerto HTTP y de raft
      # (los tres viven en la misma maquina en este converge) y su propio
      # directorio de configuracion, igual que mariadb_config_dir por host.
      # mariadb_orchestrator_password sale de group_vars/all.yml (comun a las
      # tres, es la misma cuenta con la que orchestrator habla a los dos
      # MariaDB).
      hosts:
        orch-1:
          orchestrator_container_name: t14-orchestrator-1
          orchestrator_config_dir: "{{ inventory_dir }}/../../../.converge/orchestrator-1"
          orchestrator_http_port: 13001
          orchestrator_raft_port: 11001
        orch-2:
          orchestrator_container_name: t14-orchestrator-2
          orchestrator_config_dir: "{{ inventory_dir }}/../../../.converge/orchestrator-2"
          orchestrator_http_port: 13002
          orchestrator_raft_port: 11002
        orch-3:
          orchestrator_container_name: t14-orchestrator-3
          orchestrator_config_dir: "{{ inventory_dir }}/../../../.converge/orchestrator-3"
          orchestrator_http_port: 13003
          orchestrator_raft_port: 11003
