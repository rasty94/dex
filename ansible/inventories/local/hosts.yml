# Inventario de converge: un solo host, este mismo (ansible_connection: local).
# Sirve para probar de verdad los roles dex y dex_dashboard antes de fiarse de
# ellos en una maquina de verdad. dex_config_dir y dex_dashboard_config_dir
# caen dentro del worktree, nunca en /etc: el objetivo es un directorio
# desechable, no el arbol del sistema.
#
# El grupo "valkey" no tiene rol propio todavia (llega en la Task 10): aqui
# solo aporta un host con ansible_host, para que la plantilla de dex/config.yaml.j2
# resuelva addresses igual que lo hara cuando ese rol exista. Nada lo despliega;
# apunta al contenedor Valkey desechable que se levanta a mano para esta prueba.
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_host: 127.0.0.1
      # community.crypto necesita el paquete "cryptography"; esta en el venv
      # del worktree (Ruling 9), no en el Python del sistema.
      ansible_python_interpreter: "{{ playbook_dir }}/../../.venv/bin/python3"
  children:
    valkey:
      hosts:
        valkey-converge:
          # No 127.0.0.1 ni host.docker.internal: el primero es el loopback
          # del propio contenedor de dex, y el segundo no resuelve desde el
          # host (macOS) donde corre wait_for. La IP LAN de esta maquina la
          # alcanzan los dos: el host de Ansible y, via Docker Desktop, el
          # contenedor. CAMBIAR por la IP real de quien reproduzca esto.
          ansible_host: 192.168.1.37
      vars:
        valkey_topology: standalone
    dex:
      hosts:
        localhost: {}
      vars:
        # IP LAN, no loopback: el panel corre en su propio contenedor y tiene
        # que poder resolver el issuer para el descubrimiento OIDC.
        dex_issuer: http://192.168.1.37:15556/dex
        # Nombre distinto del que usan los ejemplos de Ejemplos/dashboard, que
        # pueden estar corriendo en la misma maquina a la vez que este converge.
        dex_container_name: dex-converge
        dex_config_dir: "{{ playbook_dir }}/../../.converge/dex"
        dex_http_port: 15556
        dex_grpc_port: 15557
        dex_telemetry_port: 15558
        dex_valkey_port: 16379
        dex_config_owner: "{{ ansible_facts.user_id }}"
        dex_config_group: "{{ ansible_facts.user_gid }}"
        dex_storage:
          type: mysql
          host: 192.168.1.37
          port: 13306
          database: dex
          user: dex
    dex_dashboard:
      hosts:
        localhost: {}
      vars:
        dex_dashboard_container_name: dex-dashboard-converge
        dex_dashboard_config_dir: "{{ playbook_dir }}/../../.converge/dex-dashboard"
        dex_dashboard_listen_port: 15560
        dex_dashboard_base_url: "http://127.0.0.1:15560"
        dex_dashboard_grpc_address: "192.168.1.37:15557"
        dex_dashboard_admin_emails:
          - admin@example.com
        dex_dashboard_config_owner: "{{ ansible_facts.user_id }}"
        dex_dashboard_config_group: "{{ ansible_facts.user_gid }}"
