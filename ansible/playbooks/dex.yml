# El orden importa: dex se niega a arrancar sin Valkey, y con razon.
- name: CA interna
  # Antes que los demas: los tres roles (dex, el panel y valkey) consumen el
  # hecho "internal_ca_cert" que publica este rol.
  hosts: dex:dex_dashboard:valkey
  roles: [internal_ca]

- name: Valkey
  # Antes que Dex: dex se niega a arrancar sin Valkey cuando esta configurado,
  # asi que el orden no es cosmetico. valkey_sentinel se suma aqui porque un
  # voto de sentinel puede vivir en un nodo de dex, fuera del grupo valkey
  # (Task 11): sin esto ese host nunca entraria en esta tanda y su sentinel
  # no se desplegaria nunca.
  hosts: valkey:valkey_sentinel
  serial: 1
  roles: [valkey]

- name: Dex
  hosts: dex
  serial: 1        # de una en una: una actualizacion no deja el servicio abajo
  roles: [dex]

- name: Panel de administracion
  hosts: dex_dashboard
  serial: 1
  roles: [dex_dashboard]
