dex_config_dir: /etc/dex

# Nombre del contenedor. Parametrizado para poder correr un converge de
# prueba en una maquina que ya tenga otro "dex" suelto sin chocar con el.
dex_container_name: dex

dex_http_port: 5556
dex_grpc_port: 5557
dex_telemetry_port: 5558

# UID/GID del proceso dex dentro del contenedor (ver el Dockerfile del fork).
# Parametrizados para poder apuntar a un usuario no root en un converge local.
dex_config_owner: "1001"
dex_config_group: "1001"

dex_valkey_key_prefix: "dex:"
dex_valkey_port: 6379
dex_valkey_sentinel_port: 26379

# El rol valkey deja sus nodos escuchando SOLO en TLS (port 0 mas tls-port en
# managed.conf.j2), asi que sin este certificado dex habla RESP en claro
# contra un listener TLS, el Ping de pkg/valkey.New falla y dex no arranca.
#
# Es la ruta DENTRO del contenedor, no la del host: la CA se copia a
# {{ dex_config_dir }}/internal-ca.pem y docker-compose.yml.j2 la monta en
# /etc/dex/internal-ca.pem. Por eso vive en los defaults de cada rol y no en
# group_vars: el panel monta la suya en /etc/dex-dashboard/ y un solo valor
# compartido no puede ser correcto para los dos contenedores.
#
# Vaciarla ("") apaga el bloque tls:, para quien apunte el rol a un Valkey
# ajeno sin cifrar.
dex_valkey_tls_ca_cert: /etc/dex/internal-ca.pem

# Interfaz por la que se publican los puertos del contenedor. El valor de
# fabrica no cambia nada de lo de hoy.
#
# Con el balanceador delante (fase 3) esto pasa a ser un REQUISITO y no un
# ajuste: HAProxy termina el TLS y habla en claro con estos puertos, y el trato
# de trustForwardedFor es que el balanceador sea el unico camino hasta el
# panel. Quien alcance el 5560 de un nodo directamente elige su propia
# X-Forwarded-For, y entonces cada peticion anonima estrena clave en un Valkey
# que corre con noeviction: llenarlo deja a los administradores sin poder crear
# sesiones. Un cortafuegos delante sirve igual; este rol no lo gestiona.
dex_http_bind: "0.0.0.0"
dex_grpc_bind: "0.0.0.0"

# El certificado que dex PRESENTA a Valkey, no el que verifica. Los nodos
# corren con tls-auth-clients yes y sin esto rechazan la conexion: el cliente
# solo ve "Server closed the connection", el motivo esta en el log del
# servidor. Es el mismo par que ya usa el TLS del gRPC (dex-cert.pem y
# dex-key.pem, firmados por la CA interna): un segundo certificado para la
# misma maquina y la misma CA no separa nada.
#
# Rutas de DENTRO del contenedor, como dex_valkey_tls_ca_cert. Vaciar
# dex_valkey_tls_cert las apaga las dos, para quien apunte el rol a un Valkey
# ajeno que no pida certificado de cliente.
dex_valkey_tls_cert: /etc/dex/dex-cert.pem
dex_valkey_tls_key: /etc/dex/dex-key.pem

# Sin conectores externos, dex sirve con su base de contrasenas propia (el
# mismo por defecto que trae config.yaml.dist). Rellenar dex_connectors con
# los bloques de conector de verdad, tal cual van en config.yaml.
dex_enable_password_db: true
dex_connectors: []
