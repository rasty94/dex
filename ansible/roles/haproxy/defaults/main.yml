# La configuracion es entera de Ansible, al reves que en el rol valkey: HAProxy
# no reescribe su propio fichero, asi que aqui no hace falta la separacion
# managed.conf / valkey.conf.
haproxy_config_dir: /etc/haproxy

# Parametrizado por el mismo motivo que dex_container_name y
# valkey_container_name: poder correr un converge de prueba en una maquina que
# ya tenga otro haproxy suelto sin chocar con el.
haproxy_container_name: haproxy
haproxy_image: haproxy:3.0-alpine

haproxy_https_port: 443
haproxy_grpc_port: 5557

# El certificado publico del sitio. Lo aporta el operador cifrado con
# ansible-vault: no se emite aqui. La CA interna no vale para esto --el issuer
# lo consumen clientes que no la conocen-- y Let's Encrypt exigiria que el
# nombre resolviera desde internet, que es justo lo que un "sso.interno" no
# hace. Sin valor por defecto a proposito: el assert de tasks/main.yml se
# niega a desplegar sin ellos.
haproxy_tls_cert: ""
haproxy_tls_key: ""

# Politica TLS del frontend HTTPS, que es donde termina el TLS del issuer y del
# panel: dex detras sirve HTTP en claro, asi que sus web.tlsCiphers y
# web.tlsCurvePreferences no pintan nada en este despliegue. Vacias por
# defecto, y entonces HAProxy usa los suyos. Formato de OpenSSL, separado por
# dos puntos:
#   haproxy_ssl_min_ver: TLSv1.2
#   haproxy_ssl_ciphers: ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
#   haproxy_ssl_curves: X25519MLKEM768:X25519:P-256
# haproxy_ssl_ciphers solo afecta a TLS 1.2 e inferiores; las suites de TLS 1.3
# no se tocan, igual que en dex.
haproxy_ssl_min_ver: ""
haproxy_ssl_ciphers: ""
haproxy_ssl_curves: ""

# La ruta de la sonda de dex sale del issuer y NO se escribe a mano: dex sirve
# todo bajo la ruta de su issuer, asi que con https://sso.interno/dex la sonda
# es /dex/healthz y con un issuer sin ruta seria /healthz. Fijarla funcionaria
# en el inventario de ejemplo y dejaria todos los backends en DOWN en cualquier
# otro.
#
# Ojo con leerlo como "dex_issuer" a secas: esa variable la define el
# inventario en las vars del grupo dex, asi que un host del grupo loadbalancer
# NO la tiene. Se lee del primer host de dex por hostvars, igual que las
# plantillas de dex y del panel leen las direcciones de Valkey. A secas
# funcionaria en cualquier converge donde el mismo host este en los dos grupos
# y rompiria en el primer despliegue de verdad, que es la peor combinacion.
haproxy_dex_issuer: "{{ hostvars[groups['dex'][0]].dex_issuer }}"
haproxy_dex_health_path: "{{ (haproxy_dex_issuer | urlsplit('path')) | regex_replace('/$', '') }}/healthz"

# La sonda de disponibilidad del panel, no la de vida (/healthz): ver el
# comentario de be_dashboard en haproxy.cfg.j2. Cuelga de la raiz de su propio
# puerto, no del baseURL.
haproxy_dashboard_health_path: /readyz

# El nombre por el que se publica el panel. El reparto es por cabecera Host y
# no por ruta: ver el comentario largo de haproxy.cfg.j2. Sale del baseURL, con
# lo que el nombre esta declarado en un solo sitio; se lee por hostvars porque
# dex_dashboard_base_url lo define el inventario en las vars de su grupo y un
# host de loadbalancer no lo tiene.
#
# Tiene que ser DISTINTO del nombre del issuer, y el certificado del sitio
# (haproxy_tls_cert) tiene que cubrir los dos: o con las dos SAN, o con un
# comodin. El rol no lo comprueba --no abre el certificado-- asi que si no lo
# cubre, el fallo se ve como un aviso de certificado en el navegador.
haproxy_dashboard_base_url: "{{ hostvars[groups['dex_dashboard'][0]].dex_dashboard_base_url }}"
haproxy_dashboard_host: "{{ haproxy_dashboard_base_url | urlsplit('hostname') }}"

# El puerto por el que se publica MariaDB. Es el mismo 3306 de dentro: cambiarlo
# no aporta nada y obligaria a tocar dex_storage.port en el inventario.
#
# mariadb_probe_port NO se declara aqui, y no es un olvido: lo declara el
# INVENTARIO en las vars del grupo mariadb, no el rol mariadb ni este. Sus
# defaults son de la tanda de MariaDB; esta plantilla la renderiza la tanda del
# balanceador, otra tanda, leyendo por hostvars, y los defaults de un rol solo
# existen en la tanda que lo incluye -- por eso no basta con que mariadb tenga
# un default propio. Sin que el inventario lo declare, correr haproxy suelto
# falla con "undefined variable" en vez de sondear un puerto inventado, que
# dejaria todos los backends DOWN sin decir por que.
haproxy_mysql_port: 3306
