# La clave privada de la CA no sale del nodo de control. Vive junto al
# INVENTARIO y no junto al playbook: la CA es del despliegue --de estas
# maquinas, de este inventario--, no del codigo que lo despliega. Con la
# coleccion instalada, playbook_dir cae dentro de ~/.ansible/collections y
# ahi es donde iria a parar la clave con el ancla antigua. Dos despliegues con
# dos inventarios tienen dos CA, que es lo correcto.
#
# Lo que la protege de un "git add" es el .gitignore de la raiz
# (.internal-ca/ a cualquier profundidad) y el build_ignore de galaxy.yml:
# nunca entra en el repositorio ni en el tarball de la coleccion.
internal_ca_dir: "{{ inventory_dir }}/.internal-ca"
internal_ca_key_path: "{{ internal_ca_dir }}/ca-key.pem"
internal_ca_csr_path: "{{ internal_ca_dir }}/ca.csr"
internal_ca_cert_path: "{{ internal_ca_dir }}/ca-cert.pem"

internal_ca_common_name: "Dex Internal CA"
internal_ca_validity_days: 3650
internal_ca_host_cert_validity_days: 825

# SAN adicionales para el certificado de cada host, sobre las dos que ya lleva
# (su propio hostname y su ansible_host). Existen por el passthrough del gRPC
# del balanceador: con HAProxy en mode tcp, el panel marca el nombre del
# balanceador pero la sesion TLS se negocia contra el nodo de dex que toque, y
# Go verifica el certificado contra el nombre que marco. Sin el nombre del
# balanceador aqui, el panel no conecta.
#
# Formato de community.crypto: "DNS:nombre" o "IP:1.2.3.4".
#
# Cambiarlas reemite el certificado del host, y eso reinicia dex. Es lo que se
# quiere, pero conviene saberlo antes de aplicarlo.
internal_ca_extra_sans: []
