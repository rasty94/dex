# Este nodo es nuestro: lo instala, escribe su configuracion y lo arranca este
# mismo rol, a diferencia de dex_storage --que avisa en vez de negarse porque
# la base de datos no era nuestra--. Desde esta fase si lo es.
- name: Las contrasenas de MariaDB no pueden quedar vacias sin querer
  ansible.builtin.assert:
    that:
      - (mariadb_root_password | default('') | length > 0) or (mariadb_allow_no_password | bool)
      - (dex_storage_password | default('') | length > 0) or (mariadb_allow_no_password | bool)
      - (mariadb_repl_password | default('') | length > 0) or (mariadb_allow_no_password | bool)
      - (mariadb_probe_password | default('') | length > 0) or (mariadb_allow_no_password | bool)
      - (mariadb_orchestrator_password | default('') | length > 0) or (mariadb_allow_no_password | bool)
    fail_msg: >-
      Falta alguna de mariadb_root_password, dex_storage_password,
      mariadb_repl_password, mariadb_probe_password o
      mariadb_orchestrator_password. Van cifradas con ansible-vault en
      group_vars. Si esto es un converge de prueba desechable,
      mariadb_allow_no_password: true.
    success_msg: Las cinco contrasenas de MariaDB estan presentes.

# server_id no tiene default en el rol: es la identidad de replicacion y va
# explicita en el inventario. Un assert propio, porque el fallo por defecto
# ("'mariadb_server_id' is undefined" al renderizar la plantilla) no dice donde
# ponerlo ni por que no se deriva del grupo.
- name: Cada nodo declara su server_id, y el inventario es quien lo dice
  ansible.builtin.assert:
    that:
      - mariadb_server_id is defined
      - mariadb_server_id | int > 0
    fail_msg: >-
      {{ inventory_hostname }} no declara mariadb_server_id. Va en el inventario,
      distinto por nodo y mayor que cero. No se deriva del indice del grupo a
      proposito: reordenar el inventario reasignaria identidades de replicacion,
      y dos nodos con el mismo server_id rompen la replicacion sin decirlo.
    success_msg: mariadb_server_id declarado.

# ANTES de renderizar 50-dex.cnf, no despues: si el valor deja fuera el
# loopback, el nodo arranca sin escuchar ahi y el fallo aparece tres tareas mas
# tarde como "mariadb-admin ping" que nunca contesta, o como un agente de sonda
# que da 503 para siempre. El mensaje de aqui dice cual es la causa.
- name: El bind_address tiene que incluir el loopback
  ansible.builtin.assert:
    that:
      - mariadb_bind_address == '0.0.0.0'
        or '127.0.0.1' in (mariadb_bind_address | split(','))
    fail_msg: >-
      mariadb_bind_address vale "{{ mariadb_bind_address }}" y no incluye
      127.0.0.1. El rol se conecta a su PROPIO nodo por loopback --root.cnf,
      el "mariadb-admin ping" de la espera de arranque y probe.cnf del agente
      de sonda llevan host = 127.0.0.1-- asi que atarlo solo a la interfaz
      privada deja al rol sin poder hablar con el nodo que acaba de arrancar.
      MariaDB 11.4 acepta una lista separada por comas: usa
      "127.0.0.1,{{ ansible_host | default('<ip-privada>') }}".
    success_msg: mariadb_bind_address incluye el loopback.

# AQUI y no mas abajo: tiene que leerse ANTES de que nada de este rol pueda
# reiniciar el contenedor (los handlers, o un "docker compose up" con la
# definicion del servicio cambiada). Lo consume la rama 2 de la eleccion del
# primario en replicacion.yml: read_only=ON es de fichero, asi que un reinicio
# que provoca este mismo rol devuelve al primario a solo lectura y deja el par
# sin nadie escribible. Sin este hecho no habria forma de distinguir "repongo
# lo que yo mismo acabo de tirar" de "me promuevo solo", que es lo que el rol
# no hace nunca.
#
# Que el contenedor no exista todavia --arranque inicial-- o no conteste es un
# resultado valido: entonces no era escribible, y punto.
- name: Si este nodo era escribible ANTES de que el rol lo tocara
  community.docker.docker_container_exec:
    container: "{{ mariadb_container_name }}"
    command: >-
      mariadb --defaults-file=/run/secrets/root.cnf -N -B
      -e "SELECT @@read_only"
  register: mariadb_estado_previo
  changed_when: false
  failed_when: false
  no_log: true

- name: Recordarlo como hecho
  ansible.builtin.set_fact:
    mariadb_era_escribible_antes: >-
      {{ mariadb_estado_previo.rc | default(1) == 0
         and (mariadb_estado_previo.stdout | default('') | trim) == '0' }}

- name: Directorio de configuracion
  ansible.builtin.file:
    path: "{{ mariadb_config_dir }}"
    state: directory
    owner: "{{ mariadb_config_owner }}"
    group: "{{ mariadb_config_group }}"
    mode: "0750"

- name: Material TLS del nodo
  ansible.builtin.include_tasks: tls.yml

- name: Directorio de secretos
  ansible.builtin.file:
    path: "{{ mariadb_config_dir }}/secrets"
    state: directory
    owner: "{{ mariadb_config_owner }}"
    group: "{{ mariadb_config_group }}"
    mode: "0700"

- name: Las contrasenas que lee la imagen, en fichero y nunca en el entorno
  # docker inspect imprime el entorno del contenedor entero, asi que las
  # contrasenas van por MARIADB_*_FILE y en el entorno solo viaja la ruta.
  # no_log: sin esto, un -v o un --diff las imprimiria enteras.
  ansible.builtin.copy:
    content: "{{ item.valor }}"
    dest: "{{ mariadb_config_dir }}/secrets/{{ item.nombre }}"
    owner: "{{ mariadb_config_owner }}"
    group: "{{ mariadb_config_group }}"
    mode: "0600"
  loop:
    - {nombre: root-password, valor: "{{ mariadb_root_password | default('') }}"}
    - {nombre: dex-password, valor: "{{ dex_storage_password | default('') }}"}
    - nombre: root.cnf
      valor: |
        [client]
        user = root
        password = {{ mariadb_root_password | default('') }}
        host = 127.0.0.1
        port = {{ mariadb_port }}
  notify: Reiniciar mariadb
  no_log: true

- name: El fichero 50-dex.cnf, lo unico que Ansible posee
  ansible.builtin.template:
    src: 50-dex.cnf.j2
    dest: "{{ mariadb_config_dir }}/50-dex.cnf"
    owner: "{{ mariadb_config_owner }}"
    group: "{{ mariadb_config_group }}"
    mode: "0640"
  notify: Reiniciar mariadb

- name: El agente de sonda
  ansible.builtin.template:
    src: probe.sh.j2
    dest: "{{ mariadb_config_dir }}/probe.sh"
    owner: "{{ mariadb_config_owner }}"
    group: "{{ mariadb_config_group }}"
    mode: "0755"
  notify: Reiniciar mariadb

- name: Credenciales de la sonda, fuera del argv
  # no_log: lleva mariadb_probe_password en claro.
  ansible.builtin.template:
    src: probe.cnf.j2
    dest: "{{ mariadb_config_dir }}/probe.cnf"
    owner: "{{ mariadb_config_owner }}"
    group: "{{ mariadb_config_group }}"
    mode: "0600"
  notify: Reiniciar mariadb
  no_log: true

- name: Compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ mariadb_config_dir }}/docker-compose.yml"
    mode: "0644"
  notify: Reiniciar mariadb

- name: Levantar mariadb
  community.docker.docker_compose_v2:
    project_src: "{{ mariadb_config_dir }}"
    state: present

# Los handlers corren al final de la tanda, y las tareas de replicacion
# (tarea 3) necesitan el nodo respondiendo YA. Este flush es lo que ordena las
# dos cosas.
- name: Aplicar los reinicios pendientes antes de tocar la replicacion
  ansible.builtin.meta: flush_handlers

- name: Esperar a que MariaDB acepte conexiones
  # 90 segundos y no 30: el PRIMER arranque de un primario con la semisincrona
  # encendida y sin replica todavia bloquea el timeout entero
  # (rpl_semi_sync_master_timeout, 10 s) durante el bootstrap de la propia
  # imagen, y deja un "Timeout waiting for reply of binlog" en el log. Es
  # esperado, no es un fallo, y una espera corta lo leeria como un despliegue
  # roto.
  #
  # Se pregunta DESDE DENTRO del contenedor y no al puerto del host: en Docker
  # Desktop (macOS) el host no alcanza la red del contenedor, y un wait_for
  # sobre el puerto fallaria siempre en un converge local. mariadb-admin ping
  # devuelve 0 en cuanto el servidor contesta, aunque deniegue las
  # credenciales (comprobado), asi que no necesita contrasena. Y es una sonda
  # mas fuerte que "puerto abierto": el servidor tiene que responder.
  community.docker.docker_container_exec:
    container: "{{ mariadb_container_name }}"
    command: mariadb-admin -h127.0.0.1 -P{{ mariadb_port }} ping
  register: mariadb_ping
  until: mariadb_ping.rc == 0
  retries: 45
  delay: 2
  changed_when: false
  failed_when: false

- name: MariaDB tiene que responder antes de seguir
  ansible.builtin.assert:
    that:
      - mariadb_ping.rc == 0
    fail_msg: >-
      {{ mariadb_container_name }} no respondio a mariadb-admin ping en 90 s.
      El primer arranque tarda 10 s de mas a proposito (ver el comentario de
      arriba), asi que un fallo aqui es de verdad: revisar
      "docker logs {{ mariadb_container_name }}".
    success_msg: MariaDB responde.

- name: Replicacion
  ansible.builtin.include_tasks: replicacion.yml
