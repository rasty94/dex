# La regla que hace idempotente este rol vive en tasks/standalone.yml:
# managed.conf es de Ansible (se reescribe en cada despliegue), valkey.conf
# es de Valkey (se crea una sola vez y no se vuelve a tocar).
valkey_config_dir: /etc/valkey

# Nombre del contenedor y de la imagen. Parametrizado por el mismo motivo que
# dex_container_name en el rol dex: poder correr un converge de prueba en una
# maquina que ya tenga otro "valkey" suelto sin chocar con el.
valkey_container_name: valkey
valkey_image: valkey/valkey:8-alpine

valkey_port: 6379

# Este nodo es nuestro (lo instala y lo arranca este rol), asi que una
# dex_valkey_password vacia hace fallar el despliegue en vez de avisar: ver
# el assert en tasks/main.yml. Solo un converge de prueba desechable tiene
# motivo para poner esto a true, y nunca en un inventario de verdad.
valkey_allow_no_password: false

# Con noeviction (ver el comentario junto a maxmemory-policy en
# managed.conf.j2) esto es un tope duro: llegar aqui rechaza escrituras en
# vez de tirar claves.
valkey_maxmemory: 512mb

# UID/GID fijos del usuario "valkey" en la imagen oficial valkey/valkey (no
# parametrizables desde fuera: vienen en su /etc/passwd). Su entrypoint hace
# setpriv a este usuario para todo lo que no sea su propio directorio de
# trabajo (/data, cubierto por el volumen con nombre), asi que /etc/valkey
# tiene que ser legible por el.
valkey_config_owner: "999"
valkey_config_group: "1000"

# A que handler avisan las copias de tls.yml. standalone.yml lo deja en su
# valor de fabrica; sentinel.yml lo cambia a "Reiniciar sentinel" al incluir
# tls.yml, porque un voto puede no tener ningun valkey-server propio.
valkey_tls_notify_handler: Reiniciar valkey

# Sentinel (Task 11). Nombre del contenedor parametrizado por el mismo motivo
# que valkey_container_name. El puerto de control (26379) se deja en claro a
# proposito: es el que usan los propios sentinels entre si y el operador con
# valkey-cli sin --tls (ver el comentario en sentinel.conf.j2 sobre el
# certificado que sentinel si necesita para hablar con el master).
valkey_sentinel_container_name: valkey-sentinel
valkey_sentinel_port: 26379

# Cuanto tarda sentinel en declarar caido al master y cuanto le da a un
# failover antes de darlo por atascado. Valores de fabrica de Redis/Valkey;
# variables por si una red mas lenta o mas rapida que la de referencia pide
# otro numero.
valkey_sentinel_down_after_ms: 5000
valkey_sentinel_failover_timeout_ms: 60000
