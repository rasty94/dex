# Igual que en el rol dex: docker compose solo recrea un contenedor cuando
# cambia la definicion del propio servicio, no el contenido de un fichero
# montado por bind mount. recreate: always fuerza el reinicio cuando este
# handler salta.
- name: Reiniciar valkey
  community.docker.docker_compose_v2:
    project_src: "{{ valkey_config_dir }}"
    state: present
    recreate: always

# Proyecto de compose separado (project_name distinto): el mismo directorio
# aloja el compose de valkey y el de sentinel, y sin un nombre propio Docker
# Compose los confundiria bajo el nombre del directorio.
- name: Reiniciar sentinel
  community.docker.docker_compose_v2:
    project_src: "{{ valkey_config_dir }}"
    project_name: "{{ valkey_sentinel_container_name }}"
    files:
      - sentinel-compose.yml
    state: present
    recreate: always
