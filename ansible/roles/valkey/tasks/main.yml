# Este nodo es nuestro: lo instala, escribe su configuracion y lo arranca
# este mismo rol (a diferencia de dex_storage, que avisa en vez de negarse
# porque la base de datos no es nuestra). Sin contrasena, requirepass/
# masterauth quedan en "" (ver managed.conf.j2) y cualquier cliente que
# alcance el puerto TLS entra sin credenciales.
- name: La variable dex_valkey_password no puede quedar vacia sin querer
  ansible.builtin.assert:
    that:
      - (dex_valkey_password | length > 0) or (valkey_allow_no_password | bool)
    fail_msg: >-
      dex_valkey_password esta vacia: este nodo aceptaria cualquier cliente
      sin contrasena, con solo el TLS de por medio. Ponle un valor a
      dex_valkey_password, o si esto es un converge de prueba desechable,
      valkey_allow_no_password: true.
    success_msg: dex_valkey_password no esta vacia (o el escape hatch esta activo).

# La Task 11 (sentinel) y la Task 12 (cluster) anaden aqui su propio
# include_tasks, condicionado a valkey_topology, cuando esos ficheros
# existan. Hasta entonces, solo standalone: escribir un include hacia un
# fichero que no esta todavia hace fallar el --syntax-check del playbook.
- name: Valkey en topologia standalone
  ansible.builtin.include_tasks: standalone.yml
