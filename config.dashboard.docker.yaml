{{- /* NOTE: This configuration file is an example and exists only for development purposes. */ -}}
{{- /* To find more about gomplate formatting, please visit its documentation site - https://docs.gomplate.ca/ */ -}}
listen: {{ getenv "DEX_DASHBOARD_LISTEN" "0.0.0.0:5560" }}

baseURL: {{ getenv "DEX_DASHBOARD_BASE_URL" | required "$DEX_DASHBOARD_BASE_URL is required: the OIDC redirect URI is built from it" }}

dex:
  grpcAddress: {{ getenv "DEX_DASHBOARD_GRPC_ADDRESS" "dex:5557" }}
{{- if getenv "DEX_DASHBOARD_GRPC_TOKEN_FILE" "" }}
  tokenFile: {{ .Env.DEX_DASHBOARD_GRPC_TOKEN_FILE }}
{{- else }}
  token: {{ getenv "DEX_DASHBOARD_GRPC_TOKEN" "" | quote }}
{{- end }}
{{- if getenv "DEX_DASHBOARD_GRPC_CA_CERT" "" }}
  caCert: {{ .Env.DEX_DASHBOARD_GRPC_CA_CERT }}
{{- end }}
{{- if getenv "DEX_DASHBOARD_TELEMETRY_URL" "" }}
  telemetryURL: {{ .Env.DEX_DASHBOARD_TELEMETRY_URL }}
{{- end }}

oidc:
  issuer: {{ getenv "DEX_DASHBOARD_OIDC_ISSUER" | required "$DEX_DASHBOARD_OIDC_ISSUER is required" }}
  clientID: {{ getenv "DEX_DASHBOARD_OIDC_CLIENT_ID" "dex-dashboard" }}
  clientSecret: {{ getenv "DEX_DASHBOARD_OIDC_CLIENT_SECRET" "" | quote }}

admin:
{{- if getenv "DEX_DASHBOARD_ADMIN_GROUPS" "" }}
  groups:
{{- range (getenv "DEX_DASHBOARD_ADMIN_GROUPS" | strings.Split ",") }}
    - {{ . | strings.TrimSpace | quote }}
{{- end }}
{{- end }}
{{- if getenv "DEX_DASHBOARD_ADMIN_EMAILS" "" }}
  emails:
{{- range (getenv "DEX_DASHBOARD_ADMIN_EMAILS" | strings.Split ",") }}
    - {{ . | strings.TrimSpace | quote }}
{{- end }}
{{- end }}
{{- if getenv "DEX_DASHBOARD_ADMIN_WRITE_GROUPS" "" }}
  writeGroups:
{{- range (getenv "DEX_DASHBOARD_ADMIN_WRITE_GROUPS" | strings.Split ",") }}
    - {{ . | strings.TrimSpace | quote }}
{{- end }}
{{- end }}
{{- if getenv "DEX_DASHBOARD_ADMIN_WRITE_EMAILS" "" }}
  writeEmails:
{{- range (getenv "DEX_DASHBOARD_ADMIN_WRITE_EMAILS" | strings.Split ",") }}
    - {{ . | strings.TrimSpace | quote }}
{{- end }}
{{- end }}
  sessionTTL: {{ getenv "DEX_DASHBOARD_SESSION_TTL" "8h" }}
  idleTTL: {{ getenv "DEX_DASHBOARD_IDLE_TTL" "1h" }}
  reauthWindow: {{ getenv "DEX_DASHBOARD_REAUTH_WINDOW" "15m" }}

{{- /* Shares administrator sessions between replicas of this panel. No
       address keeps them in this process, which is the default. Whoever can
       write here can grant itself write permission on the panel -- the stored
       session carries CanWrite -- so this store needs the same authentication
       and TLS as any other credential store. The default key prefix keeps a
       Valkey shared with dex itself from mixing the two processes' keys.
       DEX_DASHBOARD_VALKEY_ADDRESS stays for the single-node case;
       DEX_DASHBOARD_VALKEY_ADDRESSES takes a comma-separated list for
       sentinel and cluster. */}}
{{- $dashboardValkeyAddrs := getenv "DEX_DASHBOARD_VALKEY_ADDRESSES" (getenv "DEX_DASHBOARD_VALKEY_ADDRESS" "") }}
{{- if $dashboardValkeyAddrs }}
valkey:
  mode: {{ getenv "DEX_DASHBOARD_VALKEY_MODE" "standalone" }}
  addresses:
{{- range (strings.Split "," $dashboardValkeyAddrs) }}
  - {{ . | strings.TrimSpace }}
{{- end }}
{{- if getenv "DEX_DASHBOARD_VALKEY_MASTER_SET" "" }}
  masterSet: {{ .Env.DEX_DASHBOARD_VALKEY_MASTER_SET | quote }}
{{- end }}
  keyPrefix: {{ getenv "DEX_DASHBOARD_VALKEY_KEY_PREFIX" "dex-dashboard:" | quote }}
{{- if getenv "DEX_DASHBOARD_VALKEY_USERNAME" "" }}
  username: {{ .Env.DEX_DASHBOARD_VALKEY_USERNAME | quote }}
{{- end }}
{{- if getenv "DEX_DASHBOARD_VALKEY_PASSWORD" "" }}
  password: {{ .Env.DEX_DASHBOARD_VALKEY_PASSWORD | quote }}
{{- end }}
{{- if getenv "DEX_DASHBOARD_VALKEY_DB" "" }}
  db: {{ .Env.DEX_DASHBOARD_VALKEY_DB }}
{{- end }}
{{- if or (getenv "DEX_DASHBOARD_VALKEY_TLS_CA_CERT" "") (conv.ToBool (getenv "DEX_DASHBOARD_VALKEY_TLS_INSECURE_SKIP_VERIFY" "false")) }}
  tls:
{{- if getenv "DEX_DASHBOARD_VALKEY_TLS_CA_CERT" "" }}
    caCert: {{ .Env.DEX_DASHBOARD_VALKEY_TLS_CA_CERT }}
{{- end }}
{{- if conv.ToBool (getenv "DEX_DASHBOARD_VALKEY_TLS_INSECURE_SKIP_VERIFY" "false") }}
    insecureSkipVerify: {{ conv.ToBool .Env.DEX_DASHBOARD_VALKEY_TLS_INSECURE_SKIP_VERIFY }}
{{- end }}
{{- end }}
{{- end }}
