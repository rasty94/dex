issuer: http://127.0.0.1:5556/dex

storage:
  type: sqlite3
  config:
    file: var/sqlite/dex.db

web:
  http: 127.0.0.1:5556

telemetry:
  http: 127.0.0.1:5558

grpc:
  addr: 127.0.0.1:5557
  # Callers authenticate with a shared token. Naming them is what lets the audit
  # log say which client made a call, and lets one be withdrawn without
  # re-issuing credentials to the rest. A single unnamed `token:` still works and
  # is logged as "default"; two entries may not share a secret, or the log could
  # not tell them apart.
  #
  # tokens:
  #   - name: dashboard
  #     token: a-long-random-string
  #   - name: ci
  #     token: another-long-random-string

# Browser sessions (DEX_SESSIONS_ENABLED=true; on by default in the Docker
# image). The whole block is optional -- these are the defaults -- but dex
# refuses to start if it is present and the flag is off.
#
# cookieEncryptionKey seals the cookie with AES-GCM. Without it the cookie is
# plain base64 and anything that reads or logs the value can read the session id
# inside. It does not stop a stolen cookie from being replayed: encrypted or
# not, the cookie is the credential. The key must be 16, 24 or 32 bytes and the
# same on every replica -- changing it signs everyone out.
#
# ssoSharedWithDefault is what decides whether one session can sign the user into
# a second application without asking. It stays at "none" unless a client opts in
# with its own ssoSharedWith, which is why turning sessions on does not, by
# itself, change who can get into what.
#
# sessions:
#   cookieName: dex_session
#   absoluteLifetime: 24h
#   validIfNotUsedFor: 1h
#   rememberMeCheckedByDefault: true
#   cookieEncryptionKey: a-32-byte-key-for-aes-256-here!!
#   ssoSharedWithDefault: none

# dex's own second factor (TOTP and WebAuthn security keys). Requires
# DEX_SESSIONS_ENABLED=true: it runs after the identity exists, on a dex user,
# with the secret stored by dex.
#
# connectorTypes is the field that matters when a connector already enforces its
# own second factor. Keystone does: it answers the password step with a receipt
# and asks for the code itself, before there is any identity. An authenticator
# that also applies to Keystone therefore asks the same user twice. An empty
# connectorTypes means *every* connector, so leaving it out is what causes the
# problem — dex warns at startup when it sees that.
#
# authenticators:
#   - id: totp
#     type: TOTP
#     connectorTypes: [local, ldap, oidc]   # keystone deliberately left out
#     config:
#       issuer: Dex
# defaultMFAChain: [totp]

# Per-client branding for the login pages. Without an entry a client gets its own
# logoURL from storage, and failing that the global frontend logo. primaryColor
# is interpolated into a <style> block, so only a hex colour is accepted and dex
# refuses to start on anything else.
#
# frontend:
#   clientThemes:
#     example-app:
#       logoURL: theme/example-logo.png
#       primaryColor: "#00aaff"

# "Remember this device" on the second-factor step, for connectors whose
# provider enforces the factor itself (Keystone). The cookie holds the token the
# provider issued, and the next login revalidates it instead of asking for the
# password and code again — so revoking that token upstream ends the trust
# immediately, and the encryption key is required rather than optional because
# the cookie carries a live provider credential.
#
# mfaTrust:
#   enabled: true
#   duration: 720h
#   encryptionKey: a-32-byte-key-for-aes-256-here!!

staticClients:
  - id: example-app
    redirectURIs:
      - 'http://127.0.0.1:5555/callback'
    name: 'Example App'
    secret: ZXhhbXBsZS1hcHAtc2VjcmV0

connectors:
  - type: mockCallback
    id: mock
    name: Example

enablePasswordDB: true

staticPasswords:
  - email: "admin@example.com"
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: "admin"
    name: "Admin User"
    emailVerified: true
    preferredUsername: "admin"
    groups:
      - "team-a"
      - "team-a/admins"
    userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
