issuer: http://127.0.0.1:5556/dex

storage:
  type: sqlite3
  config:
    file: var/sqlite/dex.db

web:
  http: 127.0.0.1:5556

telemetry:
  http: 127.0.0.1:5558

grpc:
  addr: 127.0.0.1:5557
  # Callers authenticate with a shared token. Naming them is what lets the audit
  # log say which client made a call, and lets one be withdrawn without
  # re-issuing credentials to the rest. A single unnamed `token:` still works and
  # is logged as "default"; two entries may not share a secret, or the log could
  # not tell them apart.
  #
  # tokens:
  #   - name: dashboard
  #     token: a-long-random-string
  #   - name: ci
  #     token: another-long-random-string

staticClients:
  - id: example-app
    redirectURIs:
      - 'http://127.0.0.1:5555/callback'
    name: 'Example App'
    secret: ZXhhbXBsZS1hcHAtc2VjcmV0

connectors:
  - type: mockCallback
    id: mock
    name: Example

enablePasswordDB: true

staticPasswords:
  - email: "admin@example.com"
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: "admin"
    name: "Admin User"
    emailVerified: true
    preferredUsername: "admin"
    groups:
      - "team-a"
      - "team-a/admins"
    userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
