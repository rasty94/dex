{{- /* NOTE: This configuration file is an example and exists only for development purposes. */ -}}
{{- /* To find more about gomplate formatting, please visit its documentation site - https://docs.gomplate.ca/ */ -}}
issuer: {{ getenv "DEX_ISSUER" "http://127.0.0.1:5556/dex" }}

storage:
  type: sqlite3
  config:
    file: {{ getenv "DEX_STORAGE_SQLITE3_CONFIG_FILE" "/var/dex/dex.db" }}

web:
{{- if getenv "DEX_WEB_HTTPS" "" }}
  https: {{ .Env.DEX_WEB_HTTPS }}
  tlsKey: {{ getenv "DEX_WEB_TLS_KEY" | required "$DEX_WEB_TLS_KEY in case of web.https is enabled" }}
  tlsCert: {{ getenv "DEX_WEB_TLS_CERT" | required "$DEX_WEB_TLS_CERT in case of web.https is enabled" }}
{{- end }}
  http: {{ getenv "DEX_WEB_HTTP" "0.0.0.0:5556" }}
  headers:
    X-Frame-Options: "DENY"
    X-Content-Type-Options: "nosniff"
    X-XSS-Protection: "1; mode=block"
    Content-Security-Policy: "default-src 'self'"
    Strict-Transport-Security: "max-age=31536000; includeSubDomains"

{{- if getenv "DEX_TELEMETRY_HTTP" }}
telemetry:
  http: {{ .Env.DEX_TELEMETRY_HTTP }}
{{- end }}

{{- /* The gRPC API is what the admin dashboard talks to. Off unless asked for:
       it is a management interface and should not be listening by default. */}}
{{- if getenv "DEX_GRPC_ADDR" "" }}
grpc:
  addr: {{ .Env.DEX_GRPC_ADDR }}
{{- if getenv "DEX_GRPC_TOKEN" "" }}
  token: {{ .Env.DEX_GRPC_TOKEN | quote }}
{{- end }}
{{- if getenv "DEX_GRPC_TLS_CERT" "" }}
  tlsCert: {{ .Env.DEX_GRPC_TLS_CERT }}
  tlsKey: {{ getenv "DEX_GRPC_TLS_KEY" | required "$DEX_GRPC_TLS_KEY in case of grpc.tlsCert is set" }}
{{- end }}
{{- end }}

expiry:
  deviceRequests: {{ getenv "DEX_EXPIRY_DEVICE_REQUESTS" "5m" }}
  idTokens: {{ getenv "DEX_EXPIRY_ID_TOKENS" "24h" }}
  authRequests: {{ getenv "DEX_EXPIRY_AUTH_REQUESTS" "24h" }}

signer:
  type: local
  config:
    keysRotationPeriod: {{ getenv "DEX_EXPIRY_SIGNING_KEYS" "6h" }}
    algorithm: {{ getenv "DEX_SIGNER_LOCAL_ALGORITHM" "RS256" }}

logger:
  level: {{ getenv "DEX_LOG_LEVEL" "info" }}
  format: {{ getenv "DEX_LOG_FORMAT" "text" }}

oauth2:
  responseTypes: {{ getenv "DEX_OAUTH2_RESPONSE_TYPES" "[code]" }}
  skipApprovalScreen: {{ getenv "DEX_OAUTH2_SKIP_APPROVAL_SCREEN" "false" }}
  alwaysShowLoginScreen: {{ getenv "DEX_OAUTH2_ALWAYS_SHOW_LOGIN_SCREEN" "false" }}
{{- if getenv "DEX_OAUTH2_PASSWORD_CONNECTOR" "" }}
  passwordConnector: {{ .Env.DEX_OAUTH2_PASSWORD_CONNECTOR }}
{{- end }}

{{- /* Browser sessions. On in this image (see the Dockerfile); dex refuses to
       start with this block present and the feature flag off, so the two are
       driven by the same variable, parsed the same way ("1" and "TRUE" count).
       ssoSharedWithDefault is deliberately not exposed: it stays at "none",
       which is what keeps a session from signing the user into a second
       application on its own. */}}
{{- if conv.ToBool (getenv "DEX_SESSIONS_ENABLED" "true") }}
sessions:
  cookieName: {{ getenv "DEX_SESSIONS_COOKIE_NAME" "dex_session" }}
  absoluteLifetime: {{ getenv "DEX_SESSIONS_ABSOLUTE_LIFETIME" "24h" }}
  validIfNotUsedFor: {{ getenv "DEX_SESSIONS_VALID_IF_NOT_USED_FOR" "1h" }}
{{- if getenv "DEX_SESSIONS_COOKIE_ENCRYPTION_KEY" "" }}
  cookieEncryptionKey: {{ .Env.DEX_SESSIONS_COOKIE_ENCRYPTION_KEY | quote }}
{{- end }}
{{- end }}

enablePasswordDB: {{ getenv "DEX_ENABLE_PASSWORD_DB" "true" }}

connectors:
{{- if getenv "DEX_CONNECTORS_ENABLE_MOCK" }}
- type: mockCallback
  id: mock
  name: Example
{{- end }}
