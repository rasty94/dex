<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>{{ issuer }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{{ url .ReqPath "static/main.css" }}" rel="stylesheet">
    <link href="{{ url .ReqPath "theme/styles.css" }}" rel="stylesheet">
    <link rel="icon" href="{{ url .ReqPath "theme/favicon.png" }}">
    {{ if .PrimaryColor }}<style>
      :root {
        --primary-color: {{ .PrimaryColor }};
        --primary-hover: {{ .PrimaryColor }};
      }
    </style>{{ end }}
  </head>

  <body class="theme-body">
    <div class="theme-navbar">
      <div class="theme-navbar__logo-wrap">
        <img class="theme-navbar__logo" src="{{ if .LogoURL }}{{ url .ReqPath .LogoURL }}{{ else }}{{ url .ReqPath logo }}{{ end }}" alt="{{ issuer }}">
      </div>
    </div>

    <div class="dex-container">
