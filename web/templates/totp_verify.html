{{ template "header.html" . }}

<div class="theme-panel">
  <h2 class="theme-heading">{{ .Tr.totp_verify_title }}</h2>
  {{ if not (eq .QRCode "") }}
  <p>{{ .Tr.totp_verify_scan }}</p>
  <div style="text-align: center; margin: 1em 0;">
    <img src="data:image/png;base64,{{ .QRCode }}" alt="QR code" width="200" height="200"/>
  </div>
  {{ else }}
  <p>{{ .Tr.totp_verify_enter }}</p>
  <p class="theme-heading">{{ .Issuer }}</p>
  {{ end }}
  <form method="post" action="{{ .PostURL }}">
    <div class="theme-form-row">
      <div class="theme-form-label">
        <label for="totp">{{ .Tr.totp_verify_label }}</label>
      </div>
      <input tabindex="1" required id="totp" name="totp" type="text"
             inputmode="numeric" pattern="[0-9]*" maxlength="6"
             autocomplete="one-time-code"
             class="theme-form-input" placeholder="000000"
             autofocus/>
    </div>

    {{ if .Invalid }}
    <div id="login-error" class="dex-error-box">
      {{ .Tr.totp_verify_invalid }}
    </div>
    {{ end }}

    <button tabindex="2" id="submit-login" type="submit" class="dex-btn theme-btn--primary">{{ .Tr.totp_verify_button }}</button>
  </form>
</div>

{{ template "footer.html" . }}
